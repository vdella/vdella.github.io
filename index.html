<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Vitor Della · Software Engineer</title>
  <meta name="description" content="Vitor Della Torre dos Santos: software engineer (C++ / Python), MSc in Automation & Systems Engineering. Fly a spaceship around my portfolio." />
  <meta name="theme-color" content="#0d1117" />
  <meta property="og:title" content="Vitor Della · Software Engineer" />
  <meta property="og:description" content="Fly a spaceship around my portfolio." />
  <meta property="og:url" content="https://vdella.github.io/" />
  <link rel="canonical" href="https://vdella.github.io/" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>

  <!-- Loader / title screen -->
  <div id="loader">
    <div class="loader-card">
      <p class="kicker">vdella / portfolio · flight mode</p>
      <h1 id="name">Vitor Della Torre dos Santos</h1>
      <p id="headline" class="sub"></p>
      <button id="launch" disabled>Loading…</button>
      <p class="tiny">WASD / arrows to fly · Shift to boost · E to open a section</p>
    </div>
  </div>

  <!-- HUD -->
  <header id="hud">
    <div class="brand"><span class="logo"></span> vdella</div>
    <div class="hud-actions">
      <button id="reset-button" class="chip" title="Back to spawn (R)">Respawn</button>
      <button id="classic-toggle" class="chip strong">Classic CV</button>
    </div>
  </header>
  <canvas id="minimap" width="150" height="150" aria-hidden="true"></canvas>
  <div id="speedometer" aria-hidden="true"><span id="speed">000</span><small>km/h</small></div>
  <div id="hint">Fly to a glowing pad to read about me</div>
  <button id="prompt" type="button"></button>

  <!-- Touch controls -->
  <div id="joystick-zone"></div>
  <div id="joystick"><div id="joystick-knob"></div></div>
  <button id="boost-button" type="button" aria-label="Boost">Boost</button>

  <!-- Section panel -->
  <div id="panel-backdrop"></div>
  <aside id="panel" role="dialog" aria-modal="true" aria-label="Section">
    <button id="panel-close" class="close" aria-label="Close">×</button>
    <div id="panel-body"></div>
  </aside>

  <!-- Classic, accessible CV (also the no-WebGL fallback) -->
  <main id="classic" aria-label="Classic CV">
    <button id="classic-close" class="close" aria-label="Close">×</button>
    <div id="classic-body"></div>
  </main>

  <noscript>
    <p style="padding:2rem;font-family:sans-serif">This portfolio needs JavaScript. Find me at
      <a href="https://github.com/vdella">github.com/vdella</a> or
      <a href="https://www.linkedin.com/in/vdella/">linkedin.com/in/vdella</a>.</p>
  </noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
